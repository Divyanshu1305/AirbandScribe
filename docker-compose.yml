version: '3.8'

# ── AirbandScribe — Aeronautical Speech Intelligence Docker Compose ─────────────
# Usage:
#   CPU (default):  docker compose up --build
#   GPU (NVIDIA):   docker compose --profile gpu up --build
#
# After startup, open http://localhost:8000 in your browser.
# ───────────────────────────────────────────────────────────────────────────────

services:

  # ── AirbandScribe CPU Service (Production Core) ─────────────────────────────
  airband-scribe-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airband-scribe-cpu
    ports:
      - "8000:8000"                   # FastAPI + React Avionics Console
    volumes:
      - airband_output:/app/output    # Persist audio outputs
      - airband_db:/app               # Persist SQLite records
      - ./test-files:/app/test-files  # Local flight test audio
    environment:
      - DEVICE=cpu
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── AirbandScribe GPU Service (CUDA Accelerated) ───────────────────────────
  airband-scribe-gpu:
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    container_name: airband-scribe-gpu
    ports:
      - "8001:8000"                   # GPU container on port 8001
    volumes:
      - airband_output:/app/output
      - airband_db:/app
      - ./test-files:/app/test-files
    environment:
      - DEVICE=cuda
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - gpu
    restart: unless-stopped

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  airband_output:
  airband_db:
